name: Android Debug APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses + ensure platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK and run checks
        run: |
          gradle assembleDebug testDebugUnitTest --no-daemon
          for attempt in 1 2 3; do
            if gradle lintDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android lint failed after 3 attempts"
              exit 1
            fi
            echo "Retrying lint after possible temporary dependency resolution issue (attempt $attempt)..."
            sleep $((attempt * 15))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ExpertMetadataStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
